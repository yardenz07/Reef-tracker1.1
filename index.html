<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Reef Tracker</title>

  <!-- הגדרות iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReefTracker">
  <meta name="theme-color" content="#030b17">

  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Reef%20Tracker%22%2C%22short_name%22%3A%22ReefTracker%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23030b17%22%2C%22theme_color%22%3A%22%23030b17%22%7D">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23051329'/%3E%3Cpath d='M256 80 C180 180 120 280 120 350 A136 136 0 0 0 392 350 C392 280 332 180 256 80 Z' fill='%2300f0ff'/%3E%3Ccircle cx='256' cy='340' r='50' fill='%23ff5e7e'/%3E%3C/svg%3E">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #030b17;
      --card-bg: rgba(9, 26, 51, 0.85);
      --card-border: rgba(0, 240, 255, 0.2);
      --text-main: #f0f6fc;
      --text-muted: #8ba2c0;

      --c-alk: #00f0ff;
      --c-ca: #ff5e7e;
      --c-mg: #b57cff;
      --c-no3: #ffb84d;
      --c-po4: #4ef2a7;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0b2247 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: calc(95px + env(safe-area-inset-bottom));
      padding-top: max(16px, env(safe-area-inset-top));
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--c-alk), var(--c-ca));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      padding: 0 16px;
      max-width: 650px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .param-row { display: flex; flex-direction: column; gap: 8px; }
    .param-header { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .input-group { display: flex; gap: 10px; }

    input[type="number"], input[type="password"], input[type="text"], textarea {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      color: #fff;
      outline: none;
    }

    input[type="number"] { direction: ltr; text-align: right; font-size: 1.15rem; }
    input:focus, textarea:focus { border-color: var(--c-alk); }

    .btn-save {
      background: linear-gradient(135deg, var(--c-alk), #00a8ff);
      color: #030b17;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-pills { display: flex; background: rgba(255, 255, 255, 0.05); padding: 4px; border-radius: 12px; margin-bottom: 12px; gap: 4px; }
    .filter-pill { flex: 1; text-align: center; padding: 8px 4px; font-size: 0.8rem; font-weight: 600; border-radius: 9px; cursor: pointer; color: var(--text-muted); }
    .filter-pill.active { background: rgba(0, 240, 255, 0.2); color: var(--c-alk); }
    .param-selectors { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .param-selectors::-webkit-scrollbar { display: none; }
    .param-chip { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; background: rgba(255, 255, 255, 0.05); color: var(--text-muted); cursor: pointer; border: 1px solid transparent; }
    .param-chip.active { border-color: currentColor; }
    .chart-wrapper { position: relative; height: 280px; width: 100%; }

    .log-item { display: flex; flex-direction: column; gap: 10px; }
    .log-top { display: flex; justify-content: space-between; align-items: center; }
    .log-date { font-size: 0.95rem; font-weight: 700; color: var(--c-alk); }
    .btn-copy { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; font-size: 0.8rem; font-weight: 600; padding: 6px 14px; border-radius: 10px; cursor: pointer; }

    .badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px; }
    .badge { background: rgba(255, 255, 255, 0.04); padding: 6px 8px; border-radius: 8px; font-size: 0.78rem; display: flex; flex-direction: column; }
    .badge-name { color: var(--text-muted); font-size: 0.7rem; }
    .badge-val { font-weight: 700; margin-top: 2px; direction: ltr; text-align: right; }

    .backup-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn-backup { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.2); color: var(--text-muted); padding: 10px; border-radius: 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer; text-align: center; }

    /* עיצוב צ'אט Gemini */
    .chat-messages {
      height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px 0;
    }

    .chat-msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-msg.user {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 168, 255, 0.3));
      border: 1px solid var(--c-alk);
      color: #fff;
    }

    .chat-msg.model {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f0f6fc;
    }

    .quick-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn-quick {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--c-alk);
      color: var(--c-alk);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(3, 11, 23, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      z-index: 1000;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active { color: var(--c-alk); }
    .tab-btn svg { width: 22px; height: 22px; fill: currentColor; }

    #toast {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--c-alk);
      color: #030b17;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(0, 240, 255, 0.4);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 2000;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>

  <div id="toast">נשמר בהצלחה!</div>

  <header>
    <h1>Reef Tracker 🪸</h1>
  </header>

  <main class="container">
    <!-- עמוד 1: הזנה -->
    <div id="page-input" class="page active">
      <div id="input-container"></div>
    </div>

    <!-- עמוד 2: גרפים -->
    <div id="page-charts" class="page">
      <div class="card">
        <div class="filter-pills">
          <div class="filter-pill" onclick="setTimeRange(7, this)">שבוע</div>
          <div class="filter-pill active" onclick="setTimeRange(14, this)">שבועיים</div>
          <div class="filter-pill" onclick="setTimeRange(30, this)">חודש</div>
          <div class="filter-pill" onclick="setTimeRange(90, this)">3 חודשים</div>
        </div>
        <div class="param-selectors" id="chart-param-chips"></div>
        <div class="chart-wrapper"><canvas id="reefChart"></canvas></div>
      </div>
    </div>

    <!-- עמוד 3: היסטוריה -->
    <div id="page-history" class="page">
      <div id="logs-container"></div>
      <div class="backup-actions">
        <button class="btn-backup" onclick="exportData()">💾 ייצוא גיבוי (JSON)</button>
        <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 ייבוא נתונים</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
      </div>
    </div>

    <!-- עמוד 4 חדש: יועץ Gemini AI -->
    <div id="page-ai" class="page">
      <!-- הגדרות מפתח וקונטקסט נפתח -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-weight:700; font-size:0.9rem; color:var(--c-alk);">הגדרות Gemini API</span>
          <button style="background:none; border:none; color:var(--text-muted); font-size:0.8rem; cursor:pointer;" onclick="toggleConfigArea()">⚙️ הגדרות וטעינה</button>
        </div>

        <div id="ai-config-area" style="display:none; flex-direction:column; gap:8px;">
          <input type="password" id="gemini-key" placeholder="הדבק Gemini API Key כאן..." onchange="saveApiKey()">
          <textarea id="context-history" rows="3" placeholder="הדבק כאן מידע רקע או שיחה קודמת עם Gemini..."></textarea>
          <button class="btn-quick" style="align-self:flex-start;" onclick="saveContextHistory()">שמור היסטוריה וקונטקסט</button>
        </div>
      </div>

      <!-- ממשק הצ'אט -->
      <div class="card" style="padding-bottom:12px;">
        <div class="chat-messages" id="chat-box">
          <div class="chat-msg model">שלום! אני יועץ הריף החכם שלך המבוסס על Gemini. תוכל ללחוץ על "צרף בדיקות היום" כדי לנתח את הערכים הנוכחיים ולקבל המלצות להמשך טיפול ומינונים.</div>
        </div>

        <div class="quick-bar">
          <button class="btn-quick" onclick="attachTodayResults()">➕ צרף בדיקות של היום</button>
          <button class="btn-quick" style="border-color:rgba(255,255,255,0.2); color:var(--text-muted);" onclick="clearChat()">🗑️ נקה שיחה</button>
        </div>

        <div class="chat-input-area">
          <input type="text" id="ai-prompt" placeholder="שאל שאלה על הערכים או הריף..." onkeydown="if(event.key==='Enter') sendGeminiMessage()">
          <button class="btn-save" id="btn-send-ai" onclick="sendGeminiMessage()">שלח</button>
        </div>
      </div>
    </div>
  </main>

  <!-- סרגל טאבים (כולל טאב AI) -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchPage('input', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      <span>הזנה</span>
    </button>
    <button class="tab-btn" onclick="switchPage('charts', this)">
      <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
      <span>גרפים</span>
    </button>
    <button class="tab-btn" onclick="switchPage('history', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span>היסטוריה</span>
    </button>
    <button class="tab-btn" onclick="switchPage('ai', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.72V7h2a3 3 0 0 1 3 3v1h1a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-1v1a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-1H3a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3h1v-1a3 3 0 0 1 3-3h2V5.72A2 2 0 0 1 10 4a2 2 0 0 1 2-2m-3 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/></svg>
      <span>יועץ AI</span>
    </button>
  </nav>

  <script>
    const PARAMS = [
      { key: 'alkalinity', name: 'אלקליניטי', unit: 'dKH', color: 'var(--c-alk)', hex: '#00f0ff' },
      { key: 'calcium', name: 'קלציום', unit: 'ppm', color: 'var(--c-ca)', hex: '#ff5e7e' },
      { key: 'magnesium', name: 'מגנזיום', unit: 'ppm', color: 'var(--c-mg)', hex: '#b57cff' },
      { key: 'nitrate', name: 'ניטראט', unit: 'ppm', color: 'var(--c-no3)', hex: '#ffb84d' },
      { key: 'phosphate', name: 'פוספאט', unit: 'ppm', color: 'var(--c-po4)', hex: '#4ef2a7' }
    ];

    let selectedDays = 14;
    let selectedChartParam = 'alkalinity';
    let chartInstance = null;
    const STORAGE_KEY = 'REEF_TRACKER_DATA_V1';

    let chatConversation = [];

    function getAllLogsSync() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function saveAllLogsSync(logs) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(logs)); } catch (e) {}
    }

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function saveParam(key) {
      const input = document.getElementById(`input-${key}`);
      const val = parseFloat(input.value);
      if (isNaN(val)) return;

      const dateStr = getTodayKey();
      const roundedVal = Math.round(val * 100) / 100;
      let logs = getAllLogsSync();
      let record = logs.find(l => l.dateStr === dateStr);

      if (!record) {
        record = { dateStr: dateStr, timestamp: Date.now() };
        logs.push(record);
      }

      record[key] = roundedVal;
      record.timestamp = Date.now();
      saveAllLogsSync(logs);

      input.value = '';
      showToast(`נשמר: ${roundedVal}`);
      renderLogs();
    }

    function renderInputCards() {
      const container = document.getElementById('input-container');
      container.innerHTML = PARAMS.map(p => `
        <div class="card param-row">
          <div class="param-header" style="color: ${p.color}">
            <span class="dot" style="background: ${p.color}"></span>
            <span>${p.name} (${p.unit})</span>
          </div>
          <div class="input-group">
            <input type="number" id="input-${p.key}" step="0.01" placeholder="0.00" inputmode="decimal">
            <button class="btn-save" onclick="saveParam('${p.key}')">שמור</button>
          </div>
        </div>
      `).join('');
    }

    function renderParamChips() {
      const container = document.getElementById('chart-param-chips');
      container.innerHTML = PARAMS.map(p => `
        <div class="param-chip ${p.key === selectedChartParam ? 'active' : ''}" 
             style="color: ${p.color}; ${p.key === selectedChartParam ? `background: rgba(${p.hex === '#00f0ff' ? '0,240,255' : '255,255,255'}, 0.15)` : ''}"
             onclick="selectChartParam('${p.key}')">
          ${p.name}
        </div>
      `).join('');
    }

    function updateChart() {
      const logs = getAllLogsSync();
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - selectedDays);

      const filtered = logs
        .filter(l => new Date(l.dateStr) >= cutoff && l[selectedChartParam] !== undefined)
        .sort((a, b) => new Date(a.dateStr) - new Date(b.dateStr));

      const labels = filtered.map(l => {
        const parts = l.dateStr.split('-');
        return `${parts[2]}/${parts[1]}`;
      });
      const data = filtered.map(l => l[selectedChartParam]);
      const paramObj = PARAMS.find(p => p.key === selectedChartParam);

      if (chartInstance) chartInstance.destroy();
      const canvas = document.getElementById('reefChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `${paramObj.name} (${paramObj.unit})`,
            data: data,
            borderColor: paramObj.hex,
            backgroundColor: `${paramObj.hex}22`,
            borderWidth: 3,
            pointBackgroundColor: paramObj.hex,
            pointRadius: 5,
            fill: true,
            tension: 0.35
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255, 255, 255, 0.06)' }, ticks: { color: '#8ba2c0', font: { size: 10 } } },
            y: { grid: { color: 'rgba(255, 255, 255, 0.06)' }, ticks: { color: '#8ba2c0', font: { size: 11 } } }
          }
        }
      });
    }

    function setTimeRange(days, el) {
      selectedDays = days;
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      updateChart();
    }

    function selectChartParam(key) {
      selectedChartParam = key;
      renderParamChips();
      updateChart();
    }

    function renderLogs() {
      const logs = getAllLogsSync();
      const container = document.getElementById('logs-container');
      if (!logs.length) {
        container.innerHTML = '<div class="card" style="text-align:center; color: var(--text-muted)">אין בדיקות שמורות עדיין.</div>';
        return;
      }
      logs.sort((a, b) => new Date(b.dateStr) - new Date(a.dateStr));

      container.innerHTML = logs.map(l => {
        const parts = l.dateStr.split('-');
        const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
        return `
          <div class="card log-item">
            <div class="log-top">
              <span class="log-date">${formattedDate}</span>
              <button class="btn-copy" onclick="copyLog('${l.dateStr}')">📋 העתק</button>
            </div>
            <div class="badge-grid">
              ${PARAMS.map(p => l[p.key] !== undefined ? `
                <div class="badge">
                  <span class="badge-name">${p.name}</span>
                  <span class="badge-val" style="color: ${p.color}">${l[p.key].toFixed(2)}</span>
                </div>
              ` : '').join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function copyLog(dateStr) {
      const logs = getAllLogsSync();
      const log = logs.find(l => l.dateStr === dateStr);
      if (!log) return;
      const parts = dateStr.split('-');
      let text = `בדיקת מי אקווריום - ${parts[2]}/${parts[1]}/${parts[0]}\n-------------------------\n`;
      PARAMS.forEach(p => {
        if (log[p.key] !== undefined) text += `${p.name}: ${log[p.key].toFixed(2)} ${p.unit}\n`;
      });
      navigator.clipboard.writeText(text).then(() => showToast('הנתונים הועתקו ללוח!'));
    }

    function exportData() {
      const logs = getAllLogsSync();
      const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reef_backup_${getTodayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = JSON.parse(evt.target.result);
          if (Array.isArray(data)) {
            saveAllLogsSync(data);
            showToast('הנתונים יובאו בהצלחה!');
            renderLogs();
            updateChart();
          }
        } catch { alert('שגיאה בקריאת קובץ הגיבוי'); }
      };
      reader.readAsText(file);
    }

    function toggleConfigArea() {
      const el = document.getElementById('ai-config-area');
      el.style.display = (el.style.display === 'none' || el.style.display === '') ? 'flex' : 'none';
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-key').value.trim();
      localStorage.setItem('REEF_GEMINI_KEY', key);
      showToast('מפתח API נשמר!');
    }

    function saveContextHistory() {
      const ctx = document.getElementById('context-history').value.trim();
      localStorage.setItem('REEF_GEMINI_CONTEXT', ctx);
      showToast('הקונטקסט נשמר לשיחות!');
    }

    function attachTodayResults() {
      const logs = getAllLogsSync();
      const todayKey = getTodayKey();
      const todayLog = logs.find(l => l.dateStr === todayKey);

      if (!todayLog) {
        alert('לא נמצאו עדיין בדיקות שהוזנו היום. הזן ערכים בטאב "הזנה" קודם.');
        return;
      }

      let summary = `להלן תוצאות בדיקת המים שלי מהיום (${todayKey}):\n`;
      PARAMS.forEach(p => {
        if (todayLog[p.key] !== undefined) {
          summary += `- ${p.name}: ${todayLog[p.key]} ${p.unit}\n`;
        }
      });
      summary += `אנא נתח את התוצאות ביחס לטווחים האידיאליים לאקווריום ריף, הצבע על חריגות או מגמות ביחס לאיזון (כמו אלקליניטי, קלציום, מגנזיום, ויחס ניטראט-פוספאט), והמלץ לי על צעדים מעשיים להמשך.`;

      document.getElementById('ai-prompt').value = summary;
    }

    async function sendGeminiMessage() {
      const apiKey = localStorage.getItem('REEF_GEMINI_KEY') || document.getElementById('gemini-key').value.trim();
      if (!apiKey) {
        alert('יש להזין Gemini API Key בהגדרות כדי להתחיל.');
        toggleConfigArea();
        return;
      }

      const input = document.getElementById('ai-prompt');
      const userText = input.value.trim();
      if (!userText) return;

      appendChatMessage(userText, 'user');
      input.value = '';

      const btn = document.getElementById('btn-send-ai');
      btn.disabled = true;
      btn.innerText = 'חושב...';

      const savedContext = localStorage.getItem('REEF_GEMINI_CONTEXT') || '';
      const systemInstruction = `אתה יועץ מומחה לאקווריומי ריף אלמוגים מים מלוחים (SPS, LPS ורכים). 
תפקידך לנתח את תוצאות בדיקות המים (אלקליניטי, קלציום, מגנזיום, ניטראט, פוספאט), להסביר השלכות, ולתת המלצות קונקרטיות וזהירות (תיקון מינונים הדרגתי, החלפות מים, כוונון סקימר).
${savedContext ? `מידע רקע והיסטוריית שיחות קודמות של המשתמש: """${savedContext}"""` : ''}`;

      chatConversation.push({ role: 'user', parts: [{ text: userText }] });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstruction }] },
            contents: chatConversation
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'לא התקבלה תשובה מ-Gemini.';
        chatConversation.push({ role: 'model', parts: [{ text: reply }] });
        appendChatMessage(reply, 'model');
      } catch (err) {
        appendChatMessage(`שגיאה בתקשורת עם Gemini: ${err.message}`, 'model');
      } finally {
        btn.disabled = false;
        btn.innerText = 'שלח';
      }
    }

    function appendChatMessage(text, role) {
      const box = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `chat-msg ${role}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    function clearChat() {
      chatConversation = [];
      document.getElementById('chat-box').innerHTML = '<div class="chat-msg model">השיחה נוקתה. תוכל להתחיל שיחה חדשה או לצרף שוב בדיקות.</div>';
    }

    function switchPage(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(`page-${pageId}`).classList.add('active');
      btn.classList.add('active');

      if (pageId === 'charts') {
        renderParamChips();
        updateChart();
      } else if (pageId === 'history') {
        renderLogs();
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderInputCards();
      renderLogs();
      const savedKey = localStorage.getItem('REEF_GEMINI_KEY');
      if (savedKey) document.getElementById('gemini-key').value = savedKey;
      const savedCtx = localStorage.getItem('REEF_GEMINI_CONTEXT');
      if (savedCtx) document.getElementById('context-history').value = savedCtx;
    });
  </script>
</body>
</html>
